# Publica a demonstração no GitHub Pages: o front-end com um backend que roda
# no próprio navegador (sistema_estoque/front-end/src/demo).
name: Demo online

on:
  push:
    branches: [main]
    paths:
      - "sistema_estoque/front-end/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: sistema_estoque/front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sistema_estoque/front-end/package-lock.json
      - run: npm ci
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sistema_estoque/front-end/dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
